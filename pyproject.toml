[project]
name = "itsm-bot"
version = "0.1.0"
description = "Telegram intake bot for the internal IT service desk"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
